<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tinyflux</title>
  </head>

  <body>
    <ul class="dropdown-menu" id="dropdownMenu" role="menu">
      <li role="none">
        <a class="dropdown-item" href="#" role="menuitem" id="btnOpenSidePanel">
          Open in side panel
        </a>
      </li>
      <li role="none">
        <a class="dropdown-item" href="#" role="menuitem" id="btnOpenWindow">
          Open in window
        </a>
      </li>
      <li role="none">
        <a class="dropdown-item" href="#" role="menuitem" id="btnToggleTheme">
          Toggle light/dark mode
        </a>
      </li>
      <li role="none">
        <a class="dropdown-item" href="#" role="menuitem" id="btnOpenMiniflux">
          Open Miniflux
        </a>
      </li>
      <li role="none">
        <a class="dropdown-item" href="#" role="menuitem" id="btnSettings">
          Open Settings
        </a>
      </li>
    </ul>

    <nav class="navbar" aria-label="Main navigation">
      <div class="navbar-container">
        <div class="navbar-brand">
          <span class="brand-text">Tinyflux</span>
        </div>

        <div class="navbar-actions">
          <div class="dropdown">
            <button
              id="dropdownMenuButton"
              class="btn btn-icon"
              type="button"
              aria-expanded="false"
              aria-haspopup="true"
              aria-label="Menu"
            >
              Menu
            </button>
          </div>

          <button
            id="btnMarkEntriesAsRead"
            class="btn btn-icon"
            type="button"
            aria-label="Mark entries as read"
          >
            <svg class="icon" aria-hidden="true" viewBox="0 0 16 16">
              <path d="M8 2a6 6 0 1 0 0 12A6 6 0 0 0 8 2z" />
            </svg>
          </button>

          <button
            id="btnRefresh"
            class="btn btn-icon btn-primary"
            type="button"
            aria-label="Refresh"
          >
            <svg class="icon" aria-hidden="true" viewBox="0 0 16 16">
              <path d="M8 2a6 6 0 1 0 0 12A6 6 0 0 0 8 2z" />
            </svg>
          </button>
        </div>
      </div>
    </nav>

    <main id="mainContent">
      <div class="entries" role="feed" aria-label="RSS Feed Entries">
        <div
          id="isEmpty"
          class="empty-state hidden"
          role="status"
          aria-live="polite"
        >
          <p>You have read everything!</p>
        </div>
      </div>
    </main>
  </body>
</html>
