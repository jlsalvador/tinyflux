<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-localize="__MSG_pagePopupTitle__">Tinyflux</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" sizes="32x32" href="assets/icon-dark-32x32.png" />
    <link rel="icon" sizes="16x16" href="assets/icon-dark-16x16.png" />
    <link rel="icon" sizes="48x48" href="assets/icon-dark-48x48.png" />
    <link rel="shortcut icon" href="assets/icon-dark-196x196.png" />
    <link rel="icon" sizes="196x196" href="assets/icon-dark-196x196.png" />
    <link
      rel="apple-touch-icon"
      sizes="167x167"
      href="assets/apple-touch-icon-ipad.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/apple-touch-icon.png"
    />

    <link rel="stylesheet" type="text/css" href="./popup.scss" />
  </head>
  <body>
    <script src="./popup.js"></script>

    <nav>
      <div class="container-fluid">
        <span class="navbar-brand">
          <span class="icon-tinyflux"></span> Tinyflux
        </span>
        <div class="navbar-nav">
          <div class="dropdown">
            <button
              data-title-localize="__MSG_msgMenu__"
              class="dropdown-toggle"
              type="button"
              id="dropdownMenuButton"
              title="Menu"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <span class="icon-menu"></span>
            </button>
            <ul
              class="dropdown-menu dropdown-menu-end"
              aria-labelledby="dropdownMenuButton"
            >
              <li>
                <a class="dropdown-item" href="#" id="btnOpenSidePanel">
                  <span class="icon-open-sidebar"></span>
                  <span data-localize="__MSG_pagePopupOpenInSidePanel__"
                    >Open in side panel</span
                  >
                </a>
              </li>
              <li>
                <a class="dropdown-item" href="#" id="btnOpenWindow">
                  <span class="icon-open-window"></span>
                  <span data-localize="__MSG_pagePopupOpenInWindow__"
                    >Open in window</span
                  >
                </a>
              </li>
              <li>
                <a class="dropdown-item" href="#" id="btnToggleTheme">
                  <span class="icon-theme-toggle"></span>
                  <span data-localize="__MSG_pagePopupToggleTheme__"
                    >Toggle light/dark mode</span
                  >
                </a>
              </li>
              <li>
                <a class="dropdown-item" href="#" id="btnOpenMiniflux">
                  <span class="icon-tinyflux"></span>
                  <span data-localize="__MSG_pagePopupOpenMiniflux__"
                    >Open Miniflux</span
                  >
                </a>
              </li>
              <li>
                <a class="dropdown-item" href="#" id="btnSettings">
                  <span class="icon-settings"></span>
                  <span data-localize="__MSG_pagePopupOpenSettings__"
                    >Open Settings</span
                  >
                </a>
              </li>
            </ul>
          </div>

          <button
            data-title-localize="__MSG_pagePopupMarkEntriesAsRead__"
            type="button"
            title="Mark entries as read"
            id="btnMarkEntriesAsRead"
          >
            <span class="icon-mark-entries-as-read"></span>
          </button>
          <button
            data-title-localize="__MSG_msgRefresh__"
            type="button"
            title="Refresh"
            id="btnRefresh"
          >
            <span class="icon-refresh"></span>
          </button>
        </div>
      </div>
    </nav>

    <div class="entries">
      <p id="isEmpty" class="d-none">
        <span data-localize="__MSG_pagePopupEmpty__"
          >You have read everything!</span
        >
        <span class="icon-no-more-entries"></span>
      </p>
    </div>
  </body>
</html>
