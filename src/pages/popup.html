<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-localize="__MSG_pagePopupTitle__">Tinyflux</title>

    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/icon-dark-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/icon-dark-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="assets/icon-dark-48x48.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="196x196"
      href="assets/icon-dark-196x196.png"
    />
    <link rel="shortcut icon" href="assets/icon-dark-196x196.png" />

    <!-- Apple Touch Icons -->
    <link
      rel="apple-touch-icon"
      sizes="167x167"
      href="assets/apple-touch-icon-ipad.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/apple-touch-icon.png"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Styles -->
    <link rel="stylesheet" type="text/css" href="./popup.css" />
  </head>

  <body>
    <ul class="dropdown-menu" id="dropdownMenu" role="menu">
      <li role="none">
        <a class="dropdown-item" href="#" role="menuitem" id="btnOpenSidePanel">
          <svg class="icon" aria-hidden="true" viewBox="0 0 16 16">
            <path
              d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h12zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H2z"
            />
            <path
              d="M5 4a.5.5 0 0 0-.5.5v7a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-7A.5.5 0 0 0 6 4H5z"
            />
          </svg>
          <span data-localize="__MSG_pagePopupOpenInSidePanel__"
            >Open in side panel</span
          >
        </a>
      </li>
      <li role="none">
        <a class="dropdown-item" href="#" role="menuitem" id="btnOpenWindow">
          <svg class="icon" aria-hidden="true" viewBox="0 0 16 16">
            <path
              d="M2.5 4a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zm2-.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0zm1 .5a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"
            />
            <path
              d="M2 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2H2zm13 2v2H1V3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1zM2 14a1 1 0 0 1-1-1V6h14v7a1 1 0 0 1-1 1H2z"
            />
          </svg>
          <span data-localize="__MSG_pagePopupOpenInWindow__"
            >Open in window</span
          >
        </a>
      </li>
      <li role="none">
        <a class="dropdown-item" href="#" role="menuitem" id="btnToggleTheme">
          <svg class="icon" aria-hidden="true" viewBox="0 0 16 16">
            <path
              d="M8 15A7 7 0 1 0 8 1v14zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16z"
            />
          </svg>
          <span data-localize="__MSG_pagePopupToggleTheme__"
            >Toggle light/dark mode</span
          >
        </a>
      </li>
      <li role="none">
        <a class="dropdown-item" href="#" role="menuitem" id="btnOpenMiniflux">
          <svg class="icon" aria-hidden="true" viewBox="0 0 16 16">
            <path
              d="M2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H2zm1.5 2.5c5.523 0 10 4.477 10 10a1 1 0 1 1-2 0 8 8 0 0 0-8-8 1 1 0 0 1 0-2zm0 4a6 6 0 0 1 6 6 1 1 0 1 1-2 0 4 4 0 0 0-4-4 1 1 0 0 1 0-2zm.5 7a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"
            />
          </svg>
          <span data-localize="__MSG_pagePopupOpenMiniflux__"
            >Open Miniflux</span
          >
        </a>
      </li>
      <li role="none">
        <a class="dropdown-item" href="#" role="menuitem" id="btnSettings">
          <svg class="icon" aria-hidden="true" viewBox="0 0 16 16">
            <path
              d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492M5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0"
            />
            <path
              d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115z"
            />
          </svg>
          <span data-localize="__MSG_pagePopupOpenSettings__"
            >Open Settings</span
          >
        </a>
      </li>
    </ul>

    <!-- Navigation Bar -->
    <nav class="navbar" aria-label="Main navigation">
      <div class="navbar-container">
        <!-- Brand -->
        <div class="navbar-brand">
          <svg class="icon icon-rss" aria-hidden="true" viewBox="0 0 16 16">
            <path
              d="M2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H2zm1.5 2.5c5.523 0 10 4.477 10 10a1 1 0 1 1-2 0 8 8 0 0 0-8-8 1 1 0 0 1 0-2zm0 4a6 6 0 0 1 6 6 1 1 0 1 1-2 0 4 4 0 0 0-4-4 1 1 0 0 1 0-2zm.5 7a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"
            />
          </svg>
          <span class="brand-text">Tinyflux</span>
        </div>

        <!-- Navigation Actions -->
        <div class="navbar-actions">
          <!-- Menu Dropdown -->
          <div class="dropdown">
            <button
              id="dropdownMenuButton"
              class="btn btn-icon"
              type="button"
              aria-expanded="false"
              aria-haspopup="true"
              aria-label="Menu"
              data-title-localize="__MSG_msgMenu__"
            >
              <svg class="icon" aria-hidden="true" viewBox="0 0 16 16">
                <path
                  d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"
                />
              </svg>
            </button>
          </div>

          <!-- Mark as Read Button -->
          <button
            id="btnMarkEntriesAsRead"
            class="btn btn-icon"
            type="button"
            aria-label="Mark entries as read"
            data-title-localize="__MSG_pagePopupMarkEntriesAsRead__"
          >
            <svg
              class="icon icon-check-all"
              aria-hidden="true"
              viewBox="0 0 16 16"
            >
              <path
                d="M8.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L2.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093L8.95 4.992a.252.252 0 0 1 .02-.022zm-.92 5.14l.92.92a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 1 0-1.091-1.028L9.477 9.417l-.485-.486-.943 1.179z"
              />
            </svg>
          </button>

          <!-- Refresh Button -->
          <button
            id="btnRefresh"
            class="btn btn-icon btn-primary"
            type="button"
            aria-label="Refresh"
            data-title-localize="__MSG_msgRefresh__"
          >
            <svg class="icon" aria-hidden="true" viewBox="0 0 16 16">
              <path
                fill-rule="evenodd"
                d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"
              />
              <path
                d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"
              />
            </svg>
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main id="mainContent">
      <!-- Entries Container -->
      <div class="entries" role="feed" aria-label="RSS Feed Entries">
        <!-- Empty State -->
        <div
          id="isEmpty"
          class="empty-state hidden"
          role="status"
          aria-live="polite"
        >
          <svg class="empty-icon" aria-hidden="true" viewBox="0 0 16 16">
            <path
              fill-rule="evenodd"
              d="M5 11.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5zM3.854 2.146a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708 0l-.5-.5a.5.5 0 1 1 .708-.708L2 3.293l1.146-1.147a.5.5 0 0 1 .708 0zm0 4a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708 0l-.5-.5a.5.5 0 1 1 .708-.708L2 7.293l1.146-1.147a.5.5 0 0 1 .708 0zm0 4a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708 0l-.5-.5a.5.5 0 0 1 .708-.708l.146.147 1.146-1.147a.5.5 0 0 1 .708 0z"
            />
          </svg>
          <p data-localize="__MSG_pagePopupEmpty__">
            You have read everything!
          </p>
        </div>
        <!-- Entries will be dynamically inserted here -->
      </div>
    </main>

    <!-- Scripts -->
    <script type="module" src="./popup.js"></script>
  </body>
</html>
